name: Build Android APK

# Builds a release APK in the cloud so no local Flutter/Java install is needed.
# Grab the file from the run's Artifacts section, or from Releases on a tag.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain
        run: flutter --version

      # Fills in gradlew, launcher icons and any platform scaffolding that is
      # not committed. It never overwrites files that already exist, so our
      # manifest, gradle config and MainActivity survive untouched.
      # Gradle config is generated, not committed. Pinning AGP/Gradle by hand is
      # what broke this build twice: the pins fall behind whatever Flutter
      # stable now requires. Let the template be current, then apply only the
      # four deltas Pact needs.
      - name: Generate the Android scaffold
        working-directory: app
        run: |
          flutter create --platforms=android --org com.pactapp --project-name pact .
          # flutter create also drops its counter-app smoke test, which refers
          # to a MyApp class this project does not have. Our own tests live
          # alongside it in test/.
          rm -f test/widget_test.dart

      - name: Apply Pact Gradle config
        run: node scripts/ci/patch-gradle.mjs app/android

      - name: Show resolved toolchain
        working-directory: app/android
        run: |
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties
          grep -E "com.android.application|kotlin.android|google-services" settings.gradle.kts

      # google-services.json is git-ignored (it belongs to your Firebase
      # project). Use the real one if you have added it as a secret, otherwise
      # write a structurally valid stand-in so the Gradle plugin can run.
      - name: Provide google-services.json
        working-directory: app/android/app
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS_JSON" ]; then
            echo "$GS_JSON" | base64 -d > google-services.json
            echo "Using google-services.json from repository secret."
          else
            cat > google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "pact-placeholder",
              "storage_bucket": "pact-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "com.pactapp.pact" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "PLACEHOLDER_API_KEY_NOT_FUNCTIONAL" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON
            echo "::warning::No GOOGLE_SERVICES_JSON secret set - built with a placeholder."
          fi

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      # Reported, not enforced: a lint should never cost you an APK. Output is
      # mirrored into the job summary because nobody wants to scroll raw logs.
      - name: Analyze
        working-directory: app
        continue-on-error: true
        run: |
          set +e
          flutter analyze --no-fatal-infos 2>&1 | tee ../analyze.txt
          code=${PIPESTATUS[0]}
          {
            echo "## flutter analyze"
            echo ""
            echo "<pre>"
            head -120 ../analyze.txt | sed 's/&/\&amp;/g; s/</\&lt;/g'
            echo "</pre>"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Test
        working-directory: app
        continue-on-error: true
        run: |
          set +e
          flutter test --reporter expanded 2>&1 | tee ../test.txt
          code=${PIPESTATUS[0]}
          {
            echo "## flutter test"
            echo ""
            echo "<pre>"
            grep -iE "fail|expected|actual|error" ../test.txt | head -60 | sed 's/&/\&amp;/g; s/</\&lt;/g'
            echo "</pre>"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      # Every Dart error becomes an annotation on the run, with file and line,
      # so failures are readable without opening a single log.
      - name: Annotate analysis
        if: always()
        run: node scripts/ci/annotate.mjs analyze analyze.txt

      - name: Annotate test failures
        if: always()
        run: node scripts/ci/annotate.mjs test test.txt

      - name: Build release APK
        working-directory: app
        run: |
          set +e
          flutter build apk --release 2>&1 | tee ../build.txt
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            {
              echo "## build failed"
              echo ""
              echo "<pre>"
              tail -100 ../build.txt | sed 's/&/\&amp;/g; s/</\&lt;/g'
              echo "</pre>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-logs
          path: |
            analyze.txt
            test.txt
            build.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Rename for humans
        run: cp app/build/app/outputs/flutter-apk/app-release.apk pact.apk

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: pact-apk
          path: pact.apk
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: pact.apk
          generate_release_notes: true
