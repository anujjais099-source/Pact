name: Build Android APK

# The app is rebuilt from a fresh `flutter create` on every run, and our source
# is copied in. Nothing about the build environment is hand-pinned.
#
# Why: hand-written pubspec pins and Gradle config kept falling behind whatever
# Flutter stable is today — six consecutive failures, each a different version
# mismatch. Letting Flutter resolve its own dependency versions removes the
# entire class of problem. lib/ is the product; everything else is scaffolding.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # required to publish a Release on a v* tag

    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain
        run: flutter --version

      - name: Create a fresh Flutter project
        run: flutter create --platforms=android --org com.pactapp --project-name pact build-app

      - name: Copy Pact source into it
        run: |
          set -e
          rm -rf build-app/lib build-app/test
          cp -r app/lib  build-app/lib
          cp -r app/test build-app/test
          cp app/analysis_options.yaml build-app/analysis_options.yaml

          # Android extras that are genuinely ours: camera permission, the FCM
          # channel metadata, the notification icon, splash colours.
          cp app/android/app/src/main/AndroidManifest.xml build-app/android/app/src/main/
          cp -r app/android/app/src/main/res/. build-app/android/app/src/main/res/
          cp app/android/app/proguard-rules.pro build-app/android/app/

          echo "--- lib/ files copied: $(find build-app/lib -name '*.dart' | wc -l) ---"

      - name: Add dependencies at versions this Flutter supports
        working-directory: build-app
        run: |
          set -e
          # Riverpod is pinned: 3.x rewrote the Notifier API this code uses.
          # Everything else floats to whatever the installed SDK resolves.
          flutter pub add \
            firebase_core firebase_auth cloud_firestore firebase_storage \
            firebase_messaging firebase_analytics cloud_functions \
            'flutter_riverpod:^2.6.1' go_router camera image \
            timezone flutter_timezone intl cached_network_image \
            'flutter_local_notifications:^17.2.3' shared_preferences path_provider
          flutter pub add --dev flutter_lints
          echo "--- resolved versions ---"
          grep -A 40 '^dependencies:' pubspec.yaml

      - name: Apply Pact Gradle config
        run: node scripts/ci/patch-gradle.mjs build-app/android

      # google-services.json belongs to your Firebase project. The secret is
      # used when present; otherwise a valid stand-in keeps the build green.
      - name: Provide google-services.json
        working-directory: build-app/android/app
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS_JSON" ]; then
            echo "$GS_JSON" | base64 -d > google-services.json
            echo "Using google-services.json from repository secret."
          else
            cat > google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "pact-placeholder",
              "storage_bucket": "pact-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "com.pactapp.pact" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "PLACEHOLDER_API_KEY_NOT_FUNCTIONAL" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON
            echo "::warning::No GOOGLE_SERVICES_JSON secret set - built with a placeholder."
          fi

      - name: Analyze
        working-directory: build-app
        continue-on-error: true
        run: |
          set +e
          flutter analyze --no-fatal-infos 2>&1 | tee ../analyze.txt
          code=${PIPESTATUS[0]}
          {
            echo "## flutter analyze"
            echo ""
            echo "<pre>"
            head -120 ../analyze.txt | sed 's/&/\&amp;/g; s/</\&lt;/g'
            echo "</pre>"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Test
        working-directory: build-app
        continue-on-error: true
        run: |
          set +e
          flutter test --reporter expanded 2>&1 | tee ../test.txt
          code=${PIPESTATUS[0]}
          {
            echo "## flutter test"
            echo ""
            echo "<pre>"
            grep -iE "fail|expected|actual|error" ../test.txt | head -60 | sed 's/&/\&amp;/g; s/</\&lt;/g'
            echo "</pre>"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Annotate analysis
        if: always()
        run: node scripts/ci/annotate.mjs analyze analyze.txt

      - name: Annotate test failures
        if: always()
        run: node scripts/ci/annotate.mjs test test.txt

      # Maven Central answers 403 to shared CI addresses often enough to matter.
      # Retry only on transport-shaped failures; a compile error fails at once.
      - name: Build release APK
        working-directory: build-app
        env:
          GRADLE_OPTS: "-Dorg.gradle.project.kotlin.jvm.target.validation.mode=IGNORE"
        run: |
          set +e
          code=1
          for attempt in 1 2 3; do
            echo "--- build attempt $attempt ---"
            flutter build apk --release 2>&1 | tee ../build.txt
            code=${PIPESTATUS[0]}
            [ $code -eq 0 ] && break
            if grep -qE "status code 40[38]|Could not GET|Connection reset|Read timed out" ../build.txt; then
              echo "::warning::Repository fetch failed on attempt $attempt - retrying in 20s"
              sleep 20
            else
              break
            fi
          done
          if [ $code -ne 0 ]; then
            {
              echo "## build failed"
              echo ""
              echo "<pre>"
              tail -100 ../build.txt | sed 's/&/\&amp;/g; s/</\&lt;/g'
              echo "</pre>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code

      # The build friends actually install: no Firebase, no account, straight
      # into a live Home screen. Reuses the Gradle cache from the run above.
      - name: Build demo APK
        working-directory: build-app
        env:
          GRADLE_OPTS: "-Dorg.gradle.project.kotlin.jvm.target.validation.mode=IGNORE"
        run: flutter build apk --release --dart-define=DEMO_MODE=true

      - name: Collect demo APK
        run: cp build-app/build/app/outputs/flutter-apk/app-release.apk pact-demo.apk

      - name: Upload demo APK
        uses: actions/upload-artifact@v5
        with:
          name: pact-demo-apk
          path: pact-demo.apk
          retention-days: 30

      - name: Annotate build failure
        if: failure()
        run: node scripts/ci/annotate.mjs build build.txt

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-logs
          path: |
            analyze.txt
            test.txt
            build.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Rename for humans
        run: cp build-app/build/app/outputs/flutter-apk/app-release.apk pact.apk

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: pact-apk
          path: pact.apk
          retention-days: 30

      # A tagged release is the only download link that works for someone
      # without a GitHub account. Artifacts require a login; release assets do
      # not, and releases/latest/download is a stable URL the site can hard-code.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pact-demo.apk
            pact.apk
          generate_release_notes: true
          body: |
            ## Pact - Android

            **pact-demo.apk** - install this one. No account, no internet, no
            setup: it opens straight onto a live Home screen with a partner and
            an eleven-day streak, and the camera check-in works. Android will
            warn about installing from an unknown source; tap **More details ->
            Install anyway**.

            **pact.apk** - the real build. Needs a Firebase project behind it
            and cannot sign in without one.
